cua-driver-core = { path = "../cua-driver-core" }

[target.'cfg(target_os = "windows")'.dependencies]
platform-windows = { path = "../platform-windows" }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_HiDpi",
] }
